<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#111116" />
    <meta name="description" content="A focused workspace for Cornell notes." />
    <title>Cornell Notes</title>
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="./styles.css" />
    <script src="./app.js" defer></script>
  </head>
  <body>
    <div class="app-shell">
      <aside class="activity-rail" aria-label="Workspace tools">
        <button class="rail-button menu-button" type="button" aria-label="Toggle file explorer" title="Toggle file explorer">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16" /></svg>
        </button>
        <button class="rail-button active" id="files-button" type="button" aria-label="Files" title="Files">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3.5 6.5h6l2 2h9v10h-17z" /><path d="M3.5 8.5v-2a1 1 0 0 1 1-1h5l2 2h8" /></svg>
        </button>
        <button class="rail-button" id="search-button" type="button" aria-label="Search notes" title="Search notes">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.8" cy="10.8" r="6.3" /><path d="m15.5 15.5 4 4" /></svg>
        </button>
        <button class="rail-button" id="favorites-button" type="button" aria-label="Favorites" title="Favorites">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m12 3 2.8 5.7 6.2.9-4.5 4.4 1.1 6.2-5.6-3-5.6 3 1.1-6.2L3 9.6l6.2-.9L12 3Z" /></svg>
        </button>
        <button class="rail-button" id="history-button" type="button" aria-label="Recent notes" title="Recent notes">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3.5 11a8.5 8.5 0 1 1 .8 4M3.5 5.5V11h5.5M12 7v5l3 2" /></svg>
        </button>
        <button class="rail-button" id="trash-button" type="button" aria-label="Delete current note" title="Delete current note">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4.5 7h15M9 7V4.5h6V7m-8.5 0 1 13h9l1-13M10 10v6m4-6v6" /></svg>
        </button>
        <div class="rail-spacer"></div>
        <button class="rail-button" id="settings-button" type="button" aria-label="Settings" title="Settings">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 8.5a3.5 3.5 0 1 0 0 7 3.5 3.5 0 0 0 0-7Z" /><path d="m19.4 15 .1.1a1.8 1.8 0 1 1-2.6 2.6l-.1-.1a1.8 1.8 0 0 0-3 .9v.2a1.8 1.8 0 1 1-3.6 0v-.2a1.8 1.8 0 0 0-3-.9l-.1.1a1.8 1.8 0 1 1-2.6-2.6l.1-.1a1.8 1.8 0 0 0-.9-3H3.5a1.8 1.8 0 1 1 0-3.6h.2a1.8 1.8 0 0 0 .9-3l-.1-.1a1.8 1.8 0 1 1 2.6-2.6l.1.1a1.8 1.8 0 0 0 3-.9v-.2a1.8 1.8 0 1 1 3.6 0v.2a1.8 1.8 0 0 0 3 .9l.1-.1a1.8 1.8 0 1 1 2.6 2.6l-.1.1a1.8 1.8 0 0 0 .9 3h.2a1.8 1.8 0 1 1 0 3.6h-.2a1.8 1.8 0 0 0-.9 3Z" /></svg>
        </button>
        <button class="rail-button" id="theme-button" type="button" aria-label="Toggle color theme" title="Toggle color theme">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19.2 14.4A8 8 0 0 1 9.6 4.8a8 8 0 1 0 9.6 9.6Z" /><path d="M16 3v3m-1.5-1.5h3" /></svg>
        </button>
        <button class="rail-avatar" type="button" aria-label="Prakash profile">P</button>
      </aside>

      <aside class="file-sidebar" id="file-sidebar" aria-label="File explorer">
        <div class="sidebar-brand">
          <a class="brand-mark" href="#" aria-label="Cornell Notes home">
            <svg viewBox="0 0 28 28" aria-hidden="true"><path d="M3.5 6.5c4.2-2.4 7.8-2.4 10.5 0v17c-2.7-2.4-6.3-2.4-10.5 0zM24.5 6.5C20.3 4.1 16.7 4.1 14 6.5v17c2.7-2.4 6.3-2.4 10.5 0z" /></svg>
          </a>
          <span>Cornell Notes</span>
        </div>
        <div class="explorer-heading">
          <h1>File Explorer</h1>
          <div class="explorer-actions">
            <button type="button" id="new-note-button" aria-label="New note" title="New note">+</button>
            <button type="button" id="new-folder-button" aria-label="New folder" title="New folder">
              <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M2.5 5.5h6l2 2h7v9h-15zM10 10v5m-2.5-2.5h5" /></svg>
            </button>
            <button type="button" id="refresh-button" aria-label="Refresh files" title="Refresh files">
              <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M16.5 8A6.7 6.7 0 0 0 4 6.4L2.5 8m0 0V4.5M2.5 8H6m-2.5 4a6.7 6.7 0 0 0 12.5 1.6l1.5-1.6m0 0v3.5m0-3.5H16" /></svg>
            </button>
          </div>
        </div>
        <label class="explorer-search" id="explorer-search-wrap">
          <svg viewBox="0 0 20 20" aria-hidden="true"><circle cx="8.5" cy="8.5" r="5.25" /><path d="m12.4 12.4 4.1 4.1" /></svg>
          <input id="search-input" type="search" placeholder="Search files..." autocomplete="off" />
          <kbd>ESC</kbd>
        </label>
        <nav class="file-tree" id="file-tree" aria-label="Note files"></nav>
        <button class="trash-row" id="trash-row" type="button">
          <span class="tree-chevron">›</span>
          <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M3.5 6h13M6 6l.8 11h6.4L14 6m-6-2h4m-3 5v5m2-5v5" /></svg>
          <span>Trash</span>
        </button>
      </aside>

      <main class="editor" aria-label="Cornell note editor">
        <div class="format-toolbar" role="toolbar" aria-label="Note editing tools">
          <label class="note-title-control">
            <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M5 2.5h7l4 4v11H5z" /><path d="M12 2.5v4h4M8 10h5m-5 3h5" /></svg>
            <input id="note-title" aria-label="File name" value="" spellcheck="false" />
          </label>
          <span class="toolbar-divider"></span>
          <button class="format-button bold-button" type="button" aria-label="Bold" title="Bold">B</button>
          <button class="format-button italic-button" type="button" aria-label="Italic" title="Italic">I</button>
          <button class="format-button underline-button" type="button" aria-label="Underline" title="Underline">U</button>
          <button class="format-button strike-button" type="button" aria-label="Strikethrough" title="Strikethrough">S</button>
          <span class="toolbar-divider"></span>
          <button class="format-button code-button" type="button" aria-label="Code" title="Code">&lt;/&gt;</button>
          <span class="toolbar-divider"></span>
          <button class="format-button list-format-button" type="button" aria-label="Bulleted list" title="Bulleted list">
            <svg viewBox="0 0 20 20" aria-hidden="true"><circle cx="4" cy="5" r="1" /><circle cx="4" cy="10" r="1" /><circle cx="4" cy="15" r="1" /><path d="M8 5h9M8 10h9M8 15h9" /></svg>
          </button>
          <button class="format-button numbered-format-button" type="button" aria-label="Numbered list" title="Numbered list">
            <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M3 4h2v3M3 7h3M3 10h2l-2 2h3M3 15h3l-3 2h3M9 5h8M9 11h8M9 17h8" /></svg>
          </button>
          <span class="toolbar-divider"></span>
          <button class="format-button table-button" type="button" aria-label="Insert table" title="Insert table">
            <svg viewBox="0 0 20 20" aria-hidden="true"><rect x="2.5" y="3" width="15" height="14" rx="1" /><path d="M2.5 8h15M2.5 12.5h15M7.5 3v14M12.5 3v14" /></svg>
          </button>
          <div class="document-actions">
            <button class="preview-button" id="preview-button" type="button">
              <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M2 10s2.8-5 8-5 8 5 8 5-2.8 5-8 5-8-5-8-5Z" /><circle cx="10" cy="10" r="2" /></svg>
              <span>Preview</span>
            </button>
            <button class="save-button" id="save-button" type="button">
              <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M3 3h12l2 2v12H3z" /><path d="M6 3v5h8V3M6 17v-6h8v6" /></svg>
              <span>Save</span>
            </button>
            <button class="more-button" id="more-button" type="button" aria-label="More note actions" title="More actions">···</button>
          </div>
        </div>

        <section class="document-canvas" id="document-canvas">
          <article class="cornell-sheet">
            <header class="sheet-meta">
              <label class="meta-field date-field">
                <strong>Date:</strong>
                <span class="meta-input date-value">
                  <svg viewBox="0 0 20 20" aria-hidden="true"><rect x="3" y="4.5" width="14" height="13" rx="1.5" /><path d="M6.5 2.5v4m7-4v4M3 8h14" /></svg>
                  <input id="note-date" aria-label="Note date" value="" />
                </span>
              </label>
              <label class="meta-field topic-field">
                <strong>Topic:</strong>
                <span class="meta-input topic-value">
                  <svg viewBox="0 0 20 20" aria-hidden="true"><path d="m11.5 3.5 5 5-8 8-5 1 1-5zM10 5l5 5" /></svg>
                  <input id="note-topic" aria-label="Note topic" value="" />
                </span>
              </label>
            </header>
            <div class="cornell-grid">
              <div class="sheet-heading cue-heading">Cue Column<br />(Questions)</div>
              <div class="sheet-heading notes-heading">Notes</div>
              <textarea id="note-cues" aria-label="Cue column questions" placeholder="Add questions and key terms..." spellcheck="false"></textarea>
              <textarea id="note-body" aria-label="Notes" placeholder="Write your notes here..." spellcheck="false"></textarea>
              <div class="sheet-heading summary-heading">Summary</div>
              <textarea id="note-summary" aria-label="Summary" placeholder="Summarize the main ideas..." spellcheck="false"></textarea>
            </div>
          </article>
        </section>

      </main>
      <div class="toast" id="toast" role="status" aria-live="polite"></div>
    </div>
  </body>
</html>
